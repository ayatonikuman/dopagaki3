<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>光跡 — HIKARI TRAIL</title>
<style>
  :root{
    --ink: #eaf6f4;
    --dim: rgba(234,246,244,.45);
    --line: rgba(234,246,244,.16);
    --glow: #7fe8e0;
    --panel: rgba(6,10,12,.62);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{
    font-family: "Hiragino Sans","Noto Sans JP","Helvetica Neue",system-ui,sans-serif;
    color:var(--ink);
    touch-action:manipulation;
  }
  canvas{display:block;width:100%;height:100%;}

  /* ---- start gate ---- */
  #gate{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:32px; text-align:center;
    background:radial-gradient(120% 90% at 50% 40%, #06171a 0%, #000 70%);
  }
  #gate h1{
    margin:0; font-size:13px; font-weight:400;
    letter-spacing:.62em; text-indent:.62em; color:var(--dim);
  }
  #gate .jp{
    margin:0; font-size:34px; font-weight:200; letter-spacing:.34em; text-indent:.34em;
    color:var(--ink);
  }
  #startBtn{
    appearance:none; border:1px solid var(--line); background:transparent;
    color:var(--ink); font:inherit; font-size:14px; letter-spacing:.3em; text-indent:.3em;
    padding:18px 34px; border-radius:999px; cursor:pointer;
    transition:border-color .3s, box-shadow .3s, color .3s;
  }
  #startBtn:hover,#startBtn:focus-visible{
    border-color:var(--glow); color:var(--glow);
    box-shadow:0 0 34px -8px var(--glow); outline:none;
  }
  #gate .note{
    margin:0; max-width:30em; font-size:11.5px; line-height:2; color:var(--dim);
  }
  #err{
    display:none; max-width:30em; font-size:12px; line-height:1.9;
    border-top:1px solid var(--line); padding-top:18px; color:#ffb4a8;
  }

  /* ---- controls ---- */
  #ui{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:none; gap:10px; flex-direction:column;
    background:linear-gradient(to top, rgba(0,0,0,.72), transparent);
    transition:opacity .5s; opacity:1;
  }
  #ui.hidden{opacity:0; pointer-events:none;}
  .row{display:flex; align-items:center; gap:12px;}
  .row label{
    font-size:10px; letter-spacing:.18em; color:var(--dim);
    width:3.6em; flex:none;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:22px; background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px; background:var(--line);}
  input[type=range]::-moz-range-track{height:1px; background:var(--line);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; margin-top:-6.5px;
    border-radius:50%; background:var(--glow); box-shadow:0 0 12px -2px var(--glow);
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;background:var(--glow);
  }
  .btns{display:flex; gap:8px; justify-content:space-between;}
  .btns button{
    flex:1; appearance:none; background:var(--panel); border:1px solid var(--line);
    color:var(--dim); font:inherit; font-size:10.5px; letter-spacing:.16em;
    padding:11px 4px; border-radius:8px; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .btns button.on{color:#04100f; background:var(--glow); border-color:var(--glow);}
  .btns button:focus-visible{outline:1px solid var(--glow); outline-offset:2px;}
  #hint{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:0; right:0; z-index:10;
    text-align:center; font-size:10px; letter-spacing:.2em; color:var(--dim);
    pointer-events:none; transition:opacity 1s;
  }
  @media (prefers-reduced-motion: reduce){
    #ui,#hint{transition:none;}
  }
</style>
</head>
<body>

<div id="gate">
  <h1>HIKARI TRAIL</h1>
  <p class="jp">光跡</p>
  <button id="startBtn">カメラをはじめる</button>
  <p class="note">インカメラの前で手を動かすと、動いた跡から光が湧き上がります。映像は端末の外に出ません。</p>
  <p id="err"></p>
</div>

<div id="hint">画面をタップで操作パネル</div>

<div id="ui">
  <div class="row"><label>感度</label><input id="sens" type="range" min="0.004" max="0.12" step="0.001" value="0.028"></div>
  <div class="row"><label>残像</label><input id="decay" type="range" min="0.90" max="0.995" step="0.001" value="0.968"></div>
  <div class="row"><label>上昇</label><input id="rise" type="range" min="0" max="2.5" step="0.05" value="0.9"></div>
  <div class="btns">
    <button id="camBtn">カメラ切替</button>
    <button id="modeBtn">検出を見る</button>
    <button id="clearBtn">消去</button>
    <button id="fsBtn">全画面</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

var gate=document.getElementById('gate'),
    errEl=document.getElementById('err'),
    ui=document.getElementById('ui'),
    hint=document.getElementById('hint');

var video=document.createElement('video');
video.setAttribute('playsinline','');
video.setAttribute('webkit-playsinline','');
video.muted=true; video.autoplay=true; video.playsInline=true;

var renderer,scene,camOrtho,quad;
var videoTex,prevRT,trailA,trailB,copyMat,trailMat,showMat;
var facing='user', stream=null, running=false, started=false;
var mode=0; // 0 = light, 1 = detection mask
var clock=null, t0=0;

/* ---------- shaders ---------- */
var VERT = [
'varying vec2 vUv;',
'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
].join('\n');

// copies the live frame into a buffer so the next frame has something to compare against
var COPY_FRAG = [
'varying vec2 vUv;',
'uniform sampler2D uTex;',
'uniform vec2 uScale;',
'uniform float uMirror;',
'void main(){',
'  vec2 uv = vUv;',
'  uv.x = mix(uv.x, 1.0 - uv.x, uMirror);',
'  uv = (uv - 0.5) * uScale + 0.5;',
'  gl_FragColor = vec4(texture2D(uTex, uv).rgb, 1.0);',
'}'
].join('\n');

var TRAIL_FRAG = [
'varying vec2 vUv;',
'uniform sampler2D uCur;',   // live video
'uniform sampler2D uPrev;',  // previous frame
'uniform sampler2D uTrail;', // accumulation buffer
'uniform vec2  uTexel;',
'uniform vec2  uScale;',
'uniform float uMirror;',
'uniform float uSens;',
'uniform float uDecay;',
'uniform float uRise;',
'uniform float uTime;',
'',
'float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }',
'',
'vec3 palette(float k){',
'  return 0.55 + 0.45 * cos(6.28318 * (vec3(0.62, 0.48, 0.36) + k));',
'}',
'',
'void main(){',
'  vec2 uv = vUv;',
'',
// advect the existing light upward, with a slow lateral sway so it does not look like a wipe
'  float sway = sin(uv.y * 9.0 + uTime * 0.6) * 0.18;',
'  vec2 flow  = vec2(sway * uTexel.x * uRise, -uTexel.y * uRise);',
'  vec2 suv   = uv + flow;',
'',
// 5-tap blur while advecting = free glow, and it spreads a little more each frame
'  vec3 t  = texture2D(uTrail, suv).rgb * 0.42;',
'  t += texture2D(uTrail, suv + vec2( uTexel.x, 0.0)).rgb * 0.145;',
'  t += texture2D(uTrail, suv + vec2(-uTexel.x, 0.0)).rgb * 0.145;',
'  t += texture2D(uTrail, suv + vec2(0.0,  uTexel.y)).rgb * 0.145;',
'  t += texture2D(uTrail, suv + vec2(0.0, -uTexel.y)).rgb * 0.145;',
'  t *= uDecay;',
'',
// frame difference on the mirrored, cover-fitted video
'  vec2 cuv = uv;',
'  cuv.x = mix(cuv.x, 1.0 - cuv.x, uMirror);',
'  cuv = (cuv - 0.5) * uScale + 0.5;',
'  vec3 cur = texture2D(uCur,  cuv).rgb;',
'  vec3 pre = texture2D(uPrev, uv).rgb;',
'  float d  = abs(lum(cur) - lum(pre));',
'  float m  = smoothstep(uSens, uSens * 2.6, d);',
'',
// colour the new spark by where it was born, so different parts of the body read differently
'  float k = uv.y * 0.35 + uv.x * 0.12 + uTime * 0.013;',
'  vec3 spark = palette(k) * m;',
'  spark += vec3(m * m * 0.55);',   // hot white core on fast motion
'',
'  vec3 outc = t + spark * 0.85;',
'  gl_FragColor = vec4(min(outc, vec3(4.0)), m);',
'}'
].join('\n');

var SHOW_FRAG = [
'varying vec2 vUv;',
'uniform sampler2D uTrail;',
'uniform vec2  uTexel;',
'uniform float uMode;',
'void main(){',
'  vec4 s = texture2D(uTrail, vUv);',
'  if(uMode > 0.5){',
'    float m = s.a;',
'    gl_FragColor = vec4(vec3(m) * vec3(0.55, 1.0, 0.95), 1.0);',
'    return;',
'  }',
'  vec3 c = s.rgb;',
// wide taps for bloom halo
'  vec3 b = vec3(0.0);',
'  b += texture2D(uTrail, vUv + vec2( uTexel.x * 3.0, 0.0)).rgb;',
'  b += texture2D(uTrail, vUv + vec2(-uTexel.x * 3.0, 0.0)).rgb;',
'  b += texture2D(uTrail, vUv + vec2(0.0,  uTexel.y * 3.0)).rgb;',
'  b += texture2D(uTrail, vUv + vec2(0.0, -uTexel.y * 3.0)).rgb;',
'  c += b * 0.11;',
'  c = c / (1.0 + c * 0.55);',        // soft rolloff so highlights bloom instead of clipping
'  c = pow(max(c, 0.0), vec3(0.82));',
'  float v = 1.0 - length(vUv - 0.5) * 0.55;',
'  gl_FragColor = vec4(c * v, 1.0);',
'}'
].join('\n');

/* ---------- setup ---------- */
function makeRT(w,h){
  var type = THREE.HalfFloatType;
  try{
    var ext = renderer.getContext().getExtension('OES_texture_half_float');
    if(!renderer.capabilities.isWebGL2 && !ext) type = THREE.UnsignedByteType;
  }catch(e){ type = THREE.UnsignedByteType; }
  return new THREE.WebGLRenderTarget(w,h,{
    minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
    format:THREE.RGBAFormat, type:type, depthBuffer:false, stencilBuffer:false,
    wrapS:THREE.ClampToEdgeWrapping, wrapT:THREE.ClampToEdgeWrapping
  });
}

function init(){
  renderer=new THREE.WebGLRenderer({antialias:false, alpha:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.autoClear=false;
  document.body.appendChild(renderer.domElement);

  scene=new THREE.Scene();
  camOrtho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

  videoTex=new THREE.VideoTexture(video);
  videoTex.minFilter=THREE.LinearFilter;
  videoTex.magFilter=THREE.LinearFilter;
  videoTex.format=THREE.RGBFormat;

  copyMat=new THREE.ShaderMaterial({
    vertexShader:VERT, fragmentShader:COPY_FRAG,
    uniforms:{uTex:{value:videoTex},uScale:{value:new THREE.Vector2(1,1)},uMirror:{value:1}},
    depthTest:false, depthWrite:false
  });
  trailMat=new THREE.ShaderMaterial({
    vertexShader:VERT, fragmentShader:TRAIL_FRAG,
    uniforms:{
      uCur:{value:videoTex}, uPrev:{value:null}, uTrail:{value:null},
      uTexel:{value:new THREE.Vector2(1/256,1/256)},
      uScale:{value:new THREE.Vector2(1,1)},
      uMirror:{value:1},
      uSens:{value:0.028}, uDecay:{value:0.968}, uRise:{value:0.9}, uTime:{value:0}
    },
    depthTest:false, depthWrite:false
  });
  showMat=new THREE.ShaderMaterial({
    vertexShader:VERT, fragmentShader:SHOW_FRAG,
    uniforms:{uTrail:{value:null},uTexel:{value:new THREE.Vector2(1/256,1/256)},uMode:{value:0}},
    depthTest:false, depthWrite:false
  });

  quad=new THREE.Mesh(new THREE.PlaneBufferGeometry(2,2), showMat);
  quad.frustumCulled=false;
  scene.add(quad);

  clock=new THREE.Clock();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,250); });
}

function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h);

  // simulation runs well below screen res — this is what keeps it smooth on a phone
  var maxDim=380, sc=Math.min(1, maxDim/Math.max(w,h));
  var rw=Math.max(96, Math.round(w*sc)), rh=Math.max(96, Math.round(h*sc));

  if(prevRT) prevRT.dispose();
  if(trailA) trailA.dispose();
  if(trailB) trailB.dispose();
  prevRT=makeRT(rw,rh); trailA=makeRT(rw,rh); trailB=makeRT(rw,rh);

  var texel=new THREE.Vector2(1/rw,1/rh);
  trailMat.uniforms.uTexel.value.copy(texel);
  showMat.uniforms.uTexel.value.copy(texel);
  updateScale(rw/rh);
  clearBuffers();
}

function updateScale(quadAspect){
  if(!video.videoWidth) return;
  var texAspect=video.videoWidth/video.videoHeight;
  var sx=1, sy=1;
  if(texAspect>quadAspect) sx=quadAspect/texAspect; else sy=texAspect/quadAspect;
  copyMat.uniforms.uScale.value.set(sx,sy);
  trailMat.uniforms.uScale.value.set(sx,sy);
}

function clearBuffers(){
  var old=renderer.getClearColor ? renderer.getClearColor() : null;
  renderer.setClearColor(0x000000,1);
  [prevRT,trailA,trailB].forEach(function(rt){
    renderer.setRenderTarget(rt); renderer.clear(true,false,false);
  });
  renderer.setRenderTarget(null);
}

function blit(mat, target){
  quad.material=mat;
  renderer.setRenderTarget(target||null);
  renderer.render(scene,camOrtho);
}

/* ---------- loop ---------- */
function loop(){
  if(!running) return;
  requestAnimationFrame(loop);
  if(video.readyState < 2) return;

  t0 += clock.getDelta();
  trailMat.uniforms.uTime.value = t0;

  // 1. accumulate: current frame vs previous frame, added on top of the decaying trail
  trailMat.uniforms.uPrev.value  = prevRT.texture;
  trailMat.uniforms.uTrail.value = trailA.texture;
  blit(trailMat, trailB);

  // 2. remember this frame for the next comparison
  blit(copyMat, prevRT);

  // 3. draw
  showMat.uniforms.uTrail.value = trailB.texture;
  blit(showMat, null);

  var tmp=trailA; trailA=trailB; trailB=tmp;
}

/* ---------- camera ---------- */
function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    fail('このページはHTTPS（またはlocalhost）でないとカメラを使えません。GitHub Pagesなどに置いてから開いてください。');
    return;
  }
  if(stream) stream.getTracks().forEach(function(t){t.stop();});

  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:facing, width:{ideal:640}, height:{ideal:480} }
  }).then(function(s){
    stream=s;
    video.srcObject=s;
    return video.play();
  }).then(function(){
    if(!started){
      started=true;
      init();
      gate.style.display='none';
      ui.style.display='flex';
      bindUI();
      showUI();
    }
    trailMat.uniforms.uMirror.value = (facing==='user') ? 1 : 0;
    copyMat.uniforms.uMirror.value  = (facing==='user') ? 1 : 0;
    updateScale(1);
    resize();
    running=true;
    loop();
  }).catch(function(e){
    fail('カメラを開けませんでした（' + (e && e.name ? e.name : 'error') + '）。ブラウザの設定でカメラを許可するか、HTTPSで開き直してください。');
  });
}

function fail(msg){
  errEl.textContent=msg;
  errEl.style.display='block';
}

/* ---------- ui ---------- */
var hideTimer=null;
function showUI(){
  ui.classList.remove('hidden');
  hint.style.opacity='0';
  clearTimeout(hideTimer);
  hideTimer=setTimeout(function(){ ui.classList.add('hidden'); }, 4500);
}

function bindUI(){
  document.getElementById('sens').addEventListener('input', function(e){
    trailMat.uniforms.uSens.value=parseFloat(e.target.value); showUI();
  });
  document.getElementById('decay').addEventListener('input', function(e){
    trailMat.uniforms.uDecay.value=parseFloat(e.target.value); showUI();
  });
  document.getElementById('rise').addEventListener('input', function(e){
    trailMat.uniforms.uRise.value=parseFloat(e.target.value); showUI();
  });

  var modeBtn=document.getElementById('modeBtn');
  modeBtn.addEventListener('click', function(){
    mode=mode?0:1;
    showMat.uniforms.uMode.value=mode;
    modeBtn.classList.toggle('on', mode===1);
    modeBtn.textContent = mode ? '光にもどす' : '検出を見る';
    showUI();
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    clearBuffers(); showUI();
  });

  document.getElementById('camBtn').addEventListener('click', function(){
    facing = (facing==='user') ? 'environment' : 'user';
    running=false;
    startCamera();
    showUI();
  });

  var fsBtn=document.getElementById('fsBtn');
  fsBtn.addEventListener('click', function(){
    var el=document.documentElement;
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }
    showUI();
  });

  renderer.domElement.addEventListener('pointerdown', showUI);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ running=false; }
    else if(started && stream){ running=true; loop(); }
  });
}

document.getElementById('startBtn').addEventListener('click', startCamera);

})();
</script>
</body>
</html>
